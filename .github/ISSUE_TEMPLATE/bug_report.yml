name: Bug report
description: Report a defect in CodeStrata Community
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CodeStrata. **Do not include secrets, source code, or private repository URLs.**
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CodeStrata version
      description: Output of `codestrata version`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
