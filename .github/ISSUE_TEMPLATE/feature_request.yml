name: Feature request
description: Suggest an improvement for CodeStrata Community
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Avoid attaching proprietary source.
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
