api_version: codestrata.io/rules/v1
kind: Rule
metadata:
  id: dependency.unresolved-version
  version: 1.0.0
  title: Unresolved dependency version
  category: dependency
  owner: codestrata
  measurement: M12
  tags: [dependency, hygiene, unresolved]
applies_to:
  languages: [java, python, php, csharp]
  requires:
    facts: [dependency.declarations]
select:
  source: dependency
  declarations:
    all:
      - proven_unresolved: true
condition:
  operator: dependency.unresolved_version
emit:
  finding:
    default_severity: medium
    message:
      template: >-
        Dependency '{{identity}}' in '{{path}}' references version expression
        '{{expression}}' that is proven unresolved under the supported local
        resolution contract.
      bindings:
        identity: {type: string, evidence: normalized_identity}
        path: {type: string, evidence: path}
        expression: {type: string, evidence: unresolved_expression}
    documentation_url: docs/analysis-intelligence/shared-rule-platform.md
  metric:
    name: unresolved_version_finding_count
    operation: count
evidence:
  include:
    - declaration_path
    - unresolved_expression
    - version_resolution_status
parameters: {}
