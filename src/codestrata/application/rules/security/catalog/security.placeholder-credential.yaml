api_version: codestrata.io/rules/v1
kind: Rule
metadata:
  id: security.placeholder-credential
  version: 1.0.0
  title: Placeholder credential in configuration
  category: security
  owner: codestrata
  measurement: M10
  tags: [security, hygiene, secret]
applies_to:
  languages: [java, python, javascript, typescript, php, csharp]
  requires:
    facts: [repository_sensitive.configuration_facts]
select:
  source: repository_sensitive
  configuration_facts:
    all:
      - key_family: [credential, secret]
      - placeholder_status: placeholder_literal
condition:
  operator: security.placeholder_credential
emit:
  finding:
    default_severity: low
    message:
      template: >-
        Configuration key '{{normalized_key}}' in '{{path}}'
        ({{classification}}) uses a recognized placeholder credential value.
        This is not classified as an active secret.
      bindings:
        normalized_key: {type: string, evidence: normalized_key}
        path: {type: string, evidence: path}
        classification: {type: string, evidence: classification}
    documentation_url: docs/analysis-intelligence/shared-rule-platform.md
  metric:
    name: secret_placeholder_credential_finding_count
    operation: count
evidence:
  include:
    - source_location
    - detector_id
    - safe_secret_type
    - redacted_span
  never_include:
    - raw_secret
parameters: {}
