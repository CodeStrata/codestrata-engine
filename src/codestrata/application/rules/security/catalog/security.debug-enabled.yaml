api_version: codestrata.io/rules/v1
kind: Rule
metadata:
  id: security.debug-enabled
  version: 1.0.0
  title: Debug enabled
  category: security
  owner: codestrata
  measurement: M11
  tags: [security, hygiene, configuration]
applies_to:
  languages: [java, python, javascript, typescript, php, csharp]
  requires:
    facts: [repository_sensitive.configuration_facts]
select:
  source: repository_sensitive
  configuration_facts:
    all:
      - key_family: debug
      - value_kind: boolean
condition:
  operator: security.debug_enabled
emit:
  finding:
    default_severity: medium
    message:
      template: >-
        Debug control '{{normalized_key}}' in '{{path}}' ({{classification}})
        is explicitly enabled. Production context is recorded as evidence and
        is not assumed from an unknown or indirect environment.
      bindings:
        normalized_key: {type: string, evidence: normalized_key}
        path: {type: string, evidence: path}
        classification: {type: string, evidence: classification}
    documentation_url: docs/analysis-intelligence/shared-rule-platform.md
  metric:
    name: insecure_debug_enabled_count
    operation: count
evidence:
  include:
    - source_location
    - value_classification
    - security_context
    - production_context_status
parameters: {}
