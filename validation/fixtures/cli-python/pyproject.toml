[project]
name = "codestrata-validation-cli-python"
version = "0.1.0"
description = "Minimal argparse CLI validation fixture"
requires-python = ">=3.11"

[project.scripts]
cli-tool = "cli_tool.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
