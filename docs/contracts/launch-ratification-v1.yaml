feed:
  cache_kind: versioned offline cache of published OSV records; no live fetch during
    assess
  evaluation_time_binding: pinned evaluation_time; age = evaluation_time - feed publication/update
    time
  freshness_max_age_days: 7
  license_metadata: License and release-date facts use permitted deterministic metadata
    only; absence remains UNKNOWN. No registry install.
  provider_id: osv.dev
  provider_name: OSV (osv-vulnerabilities snapshot)
  range_semantics: 'OSV affected.ranges: ECOSYSTEM and SEMVER as declared per ecosystem;
    GIT ranges only when the assessed repository commit is the OSV GIT repo. Alias
    groups use OSV aliases. Withdrawn records do not count as matches.'
  redistribution: Use the published OSV data license/terms on the pinned snapshot.
    Do not scrape NVD HTML. Redistribute only the snapshot Engine is licensed to ship.
  silent_online_fallback: false
  stale_behavior: Emit stale freshness; cached observed matches remain qualified;
    no clean claim.
  unavailable_behavior: M13 matching scope UNKNOWN; remainder of the offline assessment
    continues. Cannot prove a clean vulnerability result.
