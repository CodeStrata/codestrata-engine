rule_id_grammar:
  incompatible_restriction_invented: false
  legacy_pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)+$
  notes: Keep namespace.kebab-name and legacy codestrata-rule-* identities. Do not
    invent a new ID restriction that would reject current valid IDs. testing.test-00N
    and security.* kebab names stay as published.
  shared_pattern: ^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_-]*)+$
severity:
  context_derived_default_must_be_versioned: true
  default_and_effective_preserved: true
  existing_calibrator: codestrata.application.findings.severity_calibration
  hidden_rewrite_after_override_forbidden: true
  launch_rule: Context caps may contribute only to versioned default severity on the
    rule/config contract before an approved override. After an approved effective-severity
    override, later context classification must not rewrite that effective value.
    E01.2 binds this into the descriptor; E03/E04 must not retain a hidden post-processing
    override.
