freshness_states:
- fresh
- stale
- unknown
- not_applicable
history:
  bugfix_markers:
  - \bfix(?:es|ed)?\b
  - \bbugfix\b
  - \bhotfix\b
  - \bresolve[sd]?\b
  bugfix_markers_are_proven_defects: false
  future_timestamp: invalid for recency; disclose and exclude from recency numerator
  mailmap_policy: apply repository .mailmap when present; unlabeled bots are ordinary
    identities
  max_commits: 1000
  merge_policy: Exclude merge commits. Disclose merge-only conflict-resolution edits.
    Do not combine first-parent-only traversal with skipping merges. A first-parent-diff
    profile is a different version.
  order: committer timestamp descending, then SHA ascending
  profile_id: git.history.reachable-non-merge-180d-1000
  rename_policy: Git rename mapping when the pinned history records it; ambiguous
    stays unknown
  root_diff: root commits compare to the empty tree; others to their sole parent
  traversal: all non-merge commits reachable from the pinned head
  version: v1
  window_days: 180
independent_reviewer: Sangram Gaikwad (accepted 2026-09-19; Cursor cannot self-ratify)
m22_roles:
  context_only_contributors:
  - centrality
  - reach
  - ownership
  - active_finding_references
  contextual_missing_does_not_invalidate_rank: true
  missing_required: UNKNOWN rank in separately identified partial list by subject
    ID
  no_hidden_weights: true
  ranking_contributors:
  - complexity
  - churn
  ranking_value: sum(supported function complexity) * component changed lines
  tie_break: stable component ID ascending
m29_predicate:
  default_role: context_only
  high_centrality: M09 centrality(v) > nearest-rank p90 of the comparable universe
    V
  high_churn: changed_lines > 0 and changed_lines > nearest-rank p90 of components
    with >0 churn in the same pinned M24 window
  no_composite_score: true
  ranking: class both > churn-only > centrality-only > ordinary; then more changed
    lines; then higher centrality; then subject ID. No weighted score.
  verdict_requires_yaml: true
