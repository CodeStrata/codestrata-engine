confidence_map:
- contract_level: high
  existing_enum: RuleConfidenceLevel.HIGH | MatchEvidenceConfidence.HIGH
  existing_token: high
  notes: Exact syntax/manifest/lock/Git evidence and fully resolved witness.
- contract_level: high
  existing_enum: MatchEvidenceConfidence.CERTAIN
  existing_token: certain
  notes: CERTAIN is high with an exact witness; not a calibrated probability.
- contract_level: medium
  existing_enum: RuleConfidenceLevel.MODERATE
  existing_token: moderate
  notes: Documented static convention or association.
- contract_level: medium
  existing_enum: MatchEvidenceConfidence.MEDIUM
  existing_token: medium
  notes: Evidence-certainty medium maps to contract medium.
- contract_level: low
  existing_enum: RuleConfidenceLevel.LIMITED
  existing_token: limited
  notes: Labeled non-authoritative indicator only.
- contract_level: low
  existing_enum: MatchEvidenceConfidence.LOW
  existing_token: low
  notes: Evidence-certainty low maps to contract low.
- contract_level: unsupported
  existing_enum: RuleConfidenceLevel.UNAVAILABLE
  existing_token: unavailable
  notes: No fabricated confidence for unsupported evidence.
contract_version: '1.2'
coverage_freshness_reasons:
- applies_to: vulnerability
  cannot_prove_clean: true
  code: feed_missing
  meaning: No pinned feed snapshot is present.
- applies_to: vulnerability
  cannot_prove_clean: true
  code: feed_stale
  meaning: Feed age exceeds seven days at pinned evaluation_time.
- applies_to: vulnerability
  cannot_prove_clean: true
  code: feed_unsupported
  meaning: Ecosystem or range type is outside the ratified OSV profile.
- applies_to: git
  cannot_prove_clean: true
  code: git_history_missing
  meaning: No usable local Git history for the requested window.
- applies_to: git
  cannot_prove_clean: true
  code: git_history_shallow
  meaning: Shallow or truncated history; full-window measurement UNKNOWN.
- applies_to: git
  cannot_prove_clean: true
  code: git_window_partial
  meaning: Included commits exist but the 180-day/1000-commit bound cut off coverage.
- applies_to: coverage
  cannot_prove_clean: true
  code: unknown_denominator
  meaning: Eligible unit count is unknown; never emit 0% or 100%.
- applies_to: freshness
  cannot_prove_clean: false
  code: not_time_sensitive
  meaning: Capability has no time-sensitive source; freshness NOT_APPLICABLE.
- applies_to: freshness
  cannot_prove_clean: true
  code: source_time_missing
  meaning: Missing source publication time; do not use report generation time.
- applies_to: comparison
  cannot_prove_clean: true
  code: no_baseline
  meaning: First run; delta and outcome movement unavailable.
